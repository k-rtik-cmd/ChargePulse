apiVersion: 1
datasources:
  - name: ChargePulse PostgreSQL
    uid: chargepulse-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: postgres:5432
    user: ${POSTGRES_USER}
    isDefault: true
    editable: false
    jsonData:
      database: ${POSTGRES_DB}
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
      timeInterval: 1m
    secureJsonData:
      password: ${POSTGRES_PASSWORD}
