
services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: chargepulse-kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: HOST://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,INTERNAL://kafka:29092
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,HOST:PLAINTEXT,INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
      HOME: /tmp
      SPARK_LOCAL_DIRS: /tmp/spark-local
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  spark:
    image: apache/spark:4.0.1
    container_name: chargepulse-spark
    hostname: spark
    depends_on:
      - kafka
    volumes:
      - ./streaming:/opt/chargepulse/streaming
    working_dir: /opt/chargepulse
    command: >
      /opt/spark/bin/spark-submit
      --master local[*]
      --packages org.apache.spark:spark-sql-kafka-0-10_2.13:4.0.1
      --conf
      spark.jars.ivy=/tmp/.ivy2
      /opt/chargepulse/streaming/speed_layer.py

    environment:
      KAFKA_BOOTSTRAP: kafka:29092
    restart: unless-stopped
  postgres:
    image: postgres:16
    container_name: chargepulse-postgres

    environment:
      POSTGRES_DB: chargepulse
      POSTGRES_USER: chargepulse
      POSTGRES_PASSWORD: chargepulse_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./serving:/docker-entrypoint-initdb.d
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.5.2
    container_name: chargepulse-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - postgres
    restart: unless-stopped

  minio:
    image: pgsty/silo:latest
    container_name: chargepulse-minio
    hostname: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: chargepulseadmin
      MINIO_ROOT_PASSWORD: ChargePulseLocal2026!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

volumes:
  kafka_data:
  postgres_data:
  grafana_data:
  minio_data:
